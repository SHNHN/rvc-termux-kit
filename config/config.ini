# ============================================================
#  RVC Termux Kit - 配置文件
#
#  改完直接生效，不用重装。所有路径都是相对本文件所在目录的。
# ============================================================

# ---------- 模型 ----------
# 你训练好的 RVC v2 模型（.pth），放到 models/ 下，这里写文件名
model = Hayase-Yuuka.pth

# 说话人 id：0-108。训练时只有一个角色就填 0
# 想换味道可以挨个试，不同 id 音色不同
speaker = 0

# ---------- 音频参数 ----------
# 变调半音（整数）：
#   0    女声 → 女声，男声 → 男声（音域接近时）
#   +12  男声 → 女声（升八度）
#   -12  女声 → 男声（降八度）
#   ±1~±5  微调，用来救"太高唱不上去/太低闷"的歌
pitch = 0

# 高频提亮（dB）。RVC 的内容特征只有 16kHz，输出齿音/辅音细节
# 只剩源文件约 1/3，不提亮会"咬字不清"。
#   0    关闭（原始输出）
#   5    推荐起点
#   8    更亮
#   11   接近原曲亮度，可能发刺
eq = 5

# 混音时人声前推（dB）。0 = 与参照人声等响，3 = 推荐，6 = 人声更突出
extra = 3

# ---------- 性能（低配手机必看）----------
# CPU 线程数。手机上一般设 4；设太高反而变慢（发热降频）。
# 8 核机器可以试 6，4 核机器建议 3~4。
threads = 4

# 分块大小（秒）。内存峰值主要由它决定：
#   低配 / 内存 < 4GB  → 3（约 2.0GB 峰值，最安全）
#   中配 / 内存 6GB    → 4（约 2.7GB 峰值，推荐）
#   高配 / 内存 8GB+   → 8（约 5GB 峰值，更快）
# ⚠ 不要为了快盲目调大，OOM 被系统杀掉会前功尽弃
chunk = 4

# 分块之间的重叠秒数。1.0 通常够，接缝处有杂音可调到 1.5
pad = 1.0

# ---------- 输出 ----------
# 转换后自动提亮（对应上面的 eq）。关掉就只输出未提亮的原始结果
auto_eq = yes

# 转换完成后把源文件从 inbox/ 移到 done/，避免重复转换
archive_source = yes

# 输出格式：wav（无损，大）或 mp3（体积 1/8，够用）
output_format = wav
